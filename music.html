<!DOCTYPE html>
<html>
<head>
    <title>Music App</title>
</head>
<body style="background-color:#121212; color:white; text-align:center; font-family:Arial;">

    <h1>🎵 My Music App</h1>

    <h2>Now Playing</h2>

    <img src="https://picsum.photos/200" width="200" height="200" alt="Album Cover">

    <h3>My Favorite Song</h3>
    <p>Artist Name</p>

    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h2>🎶 Playlist</h2>

    <p>🎵 Song 1</p>
    <p>🎵 Song 2</p>
    <hr>

    <p>❤️ My Music Player</p>

</body>
</html>
